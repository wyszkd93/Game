name = "xmas-penguin-server"
main = "worker.js"
compatibility_date = "2025-01-01"

# 접속을 허용할 게임 주소(주소와 정확히 같아야 하며 경로·끝의 /는 없음). 비우면 모든 사이트에서 접속 가능
[vars]
ALLOWED_ORIGINS = "https://wyszkd93.github.io"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
