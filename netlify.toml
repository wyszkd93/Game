# Netlify 배포 설정: 빌드 없이 mongle/ 폴더를 그대로 사이트 루트로 공개한다.
[build]
  publish = "mongle"
  command = ""

# 서비스 워커와 페이지는 항상 최신 확인(설치된 앱이 업데이트를 바로 받도록)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# 폰트·아이콘은 오래 캐시
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Firebase 로그인 창을 이 사이트와 같은 주소에서 열기 위한 중계(프록시).
# 로그인 창이 다른 도메인(firebaseapp.com)이면 브라우저의 제3자 저장소 차단 때문에
# 창이 그냥 닫히는 문제가 생긴다. authDomain을 이 사이트로 두고 /__/auth/* 를 Firebase로 넘긴다.
[[redirects]]
  from = "/__/auth/*"
  to = "https://mongle-pet-1a2b3.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://mongle-pet-1a2b3.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true
