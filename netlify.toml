# Netlify 배포 설정: 빌드 없이 mongle/ 폴더를 그대로 사이트 루트로 공개한다.
[build]
  publish = "mongle"
  command = ""

# 서비스 워커와 페이지는 항상 최신 확인(설치된 앱이 업데이트를 바로 받도록)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# 폰트·아이콘은 오래 캐시
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
