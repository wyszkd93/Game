<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="눈 내리는 마을에서 눈덩이를 던지며 노는 3D 크리스마스 눈싸움 게임">
<meta name="theme-color" content="#cfe3ff">
<title>눈 내리는 마을</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../shared/lobby.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" class="hidden">
  <div id="score">⛄ 맞힌 횟수 <b id="hits">0</b> · 맞은 횟수 <b id="got">0</b></div>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <div id="players" class="hidden"></div>
  <div id="toast"></div>
  <div id="hint"></div>
  <button id="throw" aria-label="눈덩이 던지기">❄️</button>
</div>

<div id="start" class="overlay"></div>

<noscript><p style="padding:24px">이 게임은 JavaScript가 필요합니다.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
